name: Build DEB Package and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/pack-deb.yml'
      - 'src/**'
      - 'deb/share/**'
      - 'deb/dpkg-conf/**'

jobs:
  build:
    name: Build DEB package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deb_path: ${{ steps.find_deb.outputs.deb_path }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate version
      id: version
      run: |
        if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
          VERSION="${{ github.ref_name }}"
        else
          COMMIT_COUNT=$(git rev-list --count HEAD)
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          VERSION="build-${TIMESTAMP}-${COMMIT_COUNT}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Debug - Check environment
      run: |
        echo "Checking dpkg version..."
        dpkg --version || echo "dpkg not found!"
        echo "Contents of .github/scripts/compile_deb.sh:"
        cat .github/scripts/compile_deb.sh
        echo "Current directory contents:"
        ls -la

    - name: dpkg compile
      id: compile_deb
      run: bash .github/scripts/compile_deb.sh

    - name: Find .deb file anywhere
      id: find_deb
      run: |
        echo "Searching for .deb file in whole workspace..."
        find . -name "*.deb" -type f
        DEB_FILE=$(find . -name "*.deb" -type f | head -n 1)
        if [ -n "$DEB_FILE" ]; then
          echo "Found .deb file: $DEB_FILE"
          echo "deb_path=$DEB_FILE" >> $GITHUB_OUTPUT
        else
          echo "❌ No .deb file found anywhere!"
          exit 1
        fi

    - name: Upload DEB artifact
      uses: actions/upload-artifact@v4
      with:
        name: oneshot-deb
        path: ${{ steps.find_deb.outputs.deb_path }}
        if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main'
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download DEB artifact
      uses: actions/download-artifact@v4
      with:
        name: oneshot-deb
        path: ./

    - name: Debug - Check downloaded file
      run: |
        echo "Files in current directory:"
        ls -la
        if ls *.deb 1> /dev/null 2>&1; then
          echo "✅ .deb file downloaded successfully"
        else
          echo "❌ No .deb file found after download!"
          exit 1
        fi

    - name: Determine release type
      id: release_type
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          echo "prerelease=false" >> $GITHUB_OUTPUT
        else
          echo "prerelease=true" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ needs.build.outputs.version }}
        tag_name: ${{ needs.build.outputs.version }}
        draft: false
        prerelease: ${{ steps.release_type.outputs.prerelease == 'true' }}
        generate_release_notes: true
        files: |
          ${{ needs.build.outputs.deb_path }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
