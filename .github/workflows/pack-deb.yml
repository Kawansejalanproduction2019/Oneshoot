name: Build DEB Package and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/pack-deb.yml'
      - 'src/**'
      - 'deb/share/**'
      - 'deb/dpkg-conf/**'

jobs:
  build:
    name: Build DEB package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deb_path: ${{ steps.compile_deb.outputs.deb_out }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate version
      id: version
      run: |
        # Jika tag dimulai dengan 'v', pakai tag sebagai versi
        if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
          VERSION="${{ github.ref_name }}"
        else
          # Jika push ke main (tanpa tag), pakai timestamp + commit count
          COMMIT_COUNT=$(git rev-list --count HEAD)
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          VERSION="build-${TIMESTAMP}-${COMMIT_COUNT}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: dpkg compile
      id: compile_deb
      working-directory: ./
      run: bash .github/scripts/compile_deb.sh

    - name: Upload DEB artifact
      uses: actions/upload-artifact@v4
      with:
        name: oneshot-deb-${{ steps.version.outputs.version }}
        path: ${{ steps.compile_deb.outputs.deb_out }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Release dibuat jika:
    # - Push tag v*
    # - Push ke main (tanpa tag) -> akan dibuat pre-release
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main'
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download DEB artifact
      uses: actions/download-artifact@v4
      with:
        name: oneshot-deb-${{ needs.build.outputs.version }}
        path: ./

    - name: Determine release type
      id: release_type
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          echo "prerelease=false" >> $GITHUB_OUTPUT
        else
          echo "prerelease=true" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ needs.build.outputs.version }}
        tag_name: ${{ needs.build.outputs.version }}
        draft: false
        prerelease: ${{ steps.release_type.outputs.prerelease == 'true' }}
        generate_release_notes: true
        files: |
          ${{ needs.build.outputs.deb_path }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
